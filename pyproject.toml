[project]
name = "satellite-scraper"
version = "3.0.0"
description = "Satellite Image Pipeline -- Scraper 3.0"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "pillow>=10.0",
    "python-dotenv>=1.0",
    "torch>=2.2",
    "transformers>=4.40",
    "typer>=0.12",
    "pyyaml>=6.0",
    "rich>=13.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "requests-cache>=1.2",
    "anthropic>=0.40",
    "jinja2>=3.1",
    "torchvision>=0.17",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.17",
    "pre-commit>=4.0",
]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["reference"]

[tool.ruff.lint]
select = ["E", "F", "I"]
